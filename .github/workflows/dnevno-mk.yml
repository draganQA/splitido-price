name: Public prices (Macedonia)

# Once a day: the shops (Ramstore, Vero) must publish their price lists by
# 10:00 local time; this reads them afterwards. Free on a public repository.
on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

jobs:
  mk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and write
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python zbiralnik_mk.py
