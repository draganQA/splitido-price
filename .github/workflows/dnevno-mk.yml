name: Public prices (Macedonia)

# Once a day: the shops (Ramstore, Vero, Stokomak, Kam, Kipper, Zito, Spar) must publish their price lists by
# 10:00 local time; this reads them afterwards. Free on a public repository.
on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

jobs:
  mk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PDF reader (Kam publishes PDF lists)
        # update first: the runner image's package index can be stale (404 on the .deb files)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Collect and write
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python zbiralnik_mk.py
