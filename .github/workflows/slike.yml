name: Product photos (Open Food Facts)

# Once a week: reads Open Food Facts' data export (CC BY-SA) once and keeps the front photo of the
# catalogue's barcodes in the small table javne_slike. About ten minutes. Free on a public repository.
on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  slike:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the export and write
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python slike_off.py
