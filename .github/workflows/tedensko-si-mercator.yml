name: Public prices (Slovenia, Mercator)

# Twice a week: Mercator's own catalogue endpoint, 100 products a request (about 180 requests, ten minutes).
# If the site does not answer from GitHub, the job stops and writes nothing; the prices can then be imported
# from a prepared file (workflow "Import a prepared price file").
on:
  schedule:
    - cron: "30 4 * * 1,4"
  workflow_dispatch:

jobs:
  mercator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and write
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python zbiralnik_si.py --chain mercator
