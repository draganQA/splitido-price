name: Public prices (Slovenia, Mercator)

# Once a week: Mercator's online shop has a page per product (about 17,500), too many to read in one go politely.
# The pages are split into five slices that run side by side; together about one request a second, which takes
# around five hours. Free on a public repository.
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      shard:
        description: "Which slice (1-5) to read; all = every slice"
        type: choice
        default: "1"
        options: ["1", "2", "3", "4", "5", all]

jobs:
  mercator:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event.inputs.shard && github.event.inputs.shard != 'all' && format('[{0}]', github.event.inputs.shard) || '[1,2,3,4,5]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and write
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python zbiralnik_si.py --chain mercator --shard ${{ matrix.shard }}/5
